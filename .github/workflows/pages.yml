# CODE MAP / COMMENTING GUIDE
# File purpose: GitHub Actions -työnkulku, joka tarkistaa ja julkaisee GitHub Pages -sivuston.
# Structure: triggers define when the workflow runs; jobs and steps define the work to execute.

name: Deploy browser demo to GitHub Pages

on:
# JOB DEFINITION: check the job name and the steps listed within it.
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'subtitle-overlap.js'
      - 'subtitle-vtt.js'
      - 'subtitle-srt.js'
      - 'language-tag.js'
      - 'tests/**'
      - '.github/workflows/pages.yml'
# JOB DEFINITION: check the job name and the steps listed within it.
  workflow_dispatch:

permissions:
# JOB DEFINITION: check the job name and the steps listed within it.
  contents: read
# JOB DEFINITION: check the job name and the steps listed within it.
  pages: write
# JOB DEFINITION: check the job name and the steps listed within it.
  id-token: write

concurrency:
# JOB DEFINITION: check the job name and the steps listed within it.
  group: pages
# JOB DEFINITION: check the job name and the steps listed within it.
  cancel-in-progress: true

jobs:
# JOB DEFINITION: check the job name and the steps listed within it.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run subtitle parser regression tests
        run: node --test tests/*.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
# JOB DEFINITION: check the job name and the steps listed within it.
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
