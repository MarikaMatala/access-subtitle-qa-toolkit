# KOMMENTOINTIOHJE / CODE MAP
# Tiedoston tarkoitus: GitHub Actions -työnkulku PHP-pohjaisen saavutettavuusauditoijan tarkistuksiin.
# Rakenne: triggerit määrittävät käynnistymishetken; jobs ja steps määrittävät suoritettavat vaiheet.

name: PHP Accessibility Auditor

on:
# TYÖVAIHEEN MÄÄRITYS: tarkista tämän osion nimi ja sen sisällä olevat step-vaiheet.
  push:
    paths:
      - "accessibility-auditor/**"
      - ".github/workflows/php-auditor.yml"
# TYÖVAIHEEN MÄÄRITYS: tarkista tämän osion nimi ja sen sisällä olevat step-vaiheet.
  pull_request:
    paths:
      - "accessibility-auditor/**"
      - ".github/workflows/php-auditor.yml"
# TYÖVAIHEEN MÄÄRITYS: tarkista tämän osion nimi ja sen sisällä olevat step-vaiheet.
  workflow_dispatch:

jobs:
# TYÖVAIHEEN MÄÄRITYS: tarkista tämän osion nimi ja sen sisällä olevat step-vaiheet.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, libxml
          coverage: none

      - name: Check PHP syntax
        run: find accessibility-auditor -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run basic tests
        working-directory: accessibility-auditor
        run: php tests/run.php
