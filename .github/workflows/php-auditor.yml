# CODE MAP / COMMENTING GUIDE
# File purpose: GitHub Actions workflow for checks on the PHP-based accessibility auditor.
# Structure: triggers define when the workflow runs; jobs and steps define the work to execute.

name: PHP Accessibility Auditor

on:
# JOB DEFINITION: check the job name and the steps listed within it.
  push:
    paths:
      - "accessibility-auditor/**"
      - ".github/workflows/php-auditor.yml"
# JOB DEFINITION: check the job name and the steps listed within it.
  pull_request:
    paths:
      - "accessibility-auditor/**"
      - ".github/workflows/php-auditor.yml"
# JOB DEFINITION: check the job name and the steps listed within it.
  workflow_dispatch:

jobs:
# JOB DEFINITION: check the job name and the steps listed within it.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, libxml
          coverage: none

      - name: Check PHP syntax
        run: find accessibility-auditor -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run basic tests
        working-directory: accessibility-auditor
        run: php tests/run.php
