name: PHP Accessibility Auditor

on:
  push:
    paths:
      - "accessibility-auditor/**"
      - ".github/workflows/php-auditor.yml"
  pull_request:
    paths:
      - "accessibility-auditor/**"
      - ".github/workflows/php-auditor.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: dom, libxml
          coverage: none

      - name: Check PHP syntax
        run: find accessibility-auditor -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run basic tests
        working-directory: accessibility-auditor
        run: php tests/run.php
